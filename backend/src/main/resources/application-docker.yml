# Profile activated by docker-compose (SPRING_PROFILES_ACTIVE=docker).
#
# Holds the settings that differ when the app runs inside the compose network
# rather than on the host: service hostnames replace localhost. Credentials match
# the `db` service in docker-compose.yml and are intentionally local-only (the
# real prod profile sources them from the environment instead).
#
# Any of these can still be overridden by environment variables at runtime.
spring:
  datasource:
    url: jdbc:postgresql://db:5432/suppliers
    username: suppliers
    password: suppliers

country:
  service:
    base-url: http://country-service:8080
