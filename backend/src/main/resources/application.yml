spring:
  application:
    name: inditex-suppliers
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/suppliers}
    username: ${SPRING_DATASOURCE_USERNAME:suppliers}
    password: ${SPRING_DATASOURCE_PASSWORD:suppliers}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    cache-names: countries
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    # Disabled by default: there is no OTLP collector in docker-compose, so an
    # always-on exporter would spam "Failed to export spans" against localhost:4318.
    # Enable it only when a collector is reachable, e.g.:
    #   TRACING_ENABLED=true OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    # This toggles the whole tracer. Spring Boot 4 also adds a per-exporter flag
    # (management.opentelemetry.tracing.export.otlp.enabled) if finer control is needed.
    enabled: ${TRACING_ENABLED:false}
    # 100% sampling when enabled so every request shows in the collector during dev.
    # application-prod.yml throttles to a representative rate.
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

country:
  service:
    base-url: ${COUNTRY_SERVICE_BASE_URL:http://localhost:8088}

resilience4j:
  circuitbreaker:
    instances:
      countryService:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Domain outcomes (unknown country) must NOT count as transport failures
        # — they would open the breaker for clients legitimately probing codes.
        ignoreExceptions:
          - com.inditex.suppliers.domain.exception.CountryUnknownException
  timelimiter:
    instances:
      countryService:
        timeoutDuration: 2s

logging:
  level:
    com.inditex.suppliers: INFO
  pattern:
    # Includes correlation id (set by CorrelationIdFilter via MDC) on every log line.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [cid:%X{correlationId:-}] %logger{40} - %msg%n"
